<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lock with F-shaped keyhole">
  <defs>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB24A"/>
      <stop offset="55%" stop-color="#F58200"/>
      <stop offset="100%" stop-color="#CF6500"/>
    </linearGradient>
    <filter id="lockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <g filter="url(#lockShadow)">
    <!-- Shackle -->
    <path d="M180 164v-34a76 76 0 0 1 152 0v34" fill="none" stroke="#F3F6FA" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lock body -->
    <rect x="116" y="158" width="280" height="248" rx="72" fill="url(#lockGrad)"/>

    <!-- F-shaped keyhole -->
    <path fill="#2F3640" transform="translate(-22 -14)" d="M236 216h76c10 0 18 8 18 18s-8 18-18 18h-40v34h32c10 0 18 8 18 18s-8 18-18 18h-32v48c0 10-8 18-18 18s-18-8-18-18V234c0-10 8-18 18-18z"/>
  </g>
</svg>
